name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build unsigned app
        run: |
          set -e

          xcodebuild \
            -project UserScriptBrowser.xcodeproj \
            -scheme UserScriptBrowser \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Find and fix app bundle
        run: |
          set -e

          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData \
            -path "*/Build/Products/Release-iphoneos/UserScriptBrowser.app" \
            -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: UserScriptBrowser.app not found"
            exit 1
          fi

          echo "App found at:"
          echo "$APP_PATH"

          EXECUTABLE="$APP_PATH/UserScriptBrowser"

          if [ ! -f "$EXECUTABLE" ]; then
            echo "ERROR: App executable not found"
            ls -la "$APP_PATH"
            exit 1
          fi

          chmod +x "$EXECUTABLE"

          PLIST="$APP_PATH/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleExecutable" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleExecutable string UserScriptBrowser" \
            "$PLIST"

          echo "Executable from Info.plist:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$PLIST"

          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/UserScriptBrowser.app

      - name: Create IPA
        run: |
          set -e

          zip -r -y UserScriptBrowser-unsigned.ipa Payload

          echo "IPA contents:"
          unzip -l UserScriptBrowser-unsigned.ipa | head -50

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: UserScriptBrowser-IPA
          path: UserScriptBrowser-unsigned.ipa
          if-no-files-found: error
