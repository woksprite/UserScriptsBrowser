name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project UserScriptBrowser.xcodeproj \
            -scheme UserScriptBrowser \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Find built app
        id: app
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "UserScriptBrowser.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "UserScriptBrowser.app not found"
            exit 1
          fi

          echo "Found app at: $APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Create unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          zip -r UserScriptBrowser-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: UserScriptBrowser-IPA
          path: UserScriptBrowser-unsigned.ipa
          if-no-files-found: error
